# Ajuste de memoria seguro para evitar que Linux mate el proceso (2GB máx)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Desactivar el demonio para liberaciones inmediatas de RAM
org.gradle.daemon=false

# Requerido por Flutter y Android
android.useAndroidX=true
android.enableJetifier=true

# Control de CPU/Procesos
org.gradle.workers.max=2
org.gradle.parallel=false

# Flags de compatibilidad de Flutter
android.builtInKotlin=false
android.newDsl=false
